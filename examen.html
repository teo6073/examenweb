
<!DOCTYPE html>
<html>
<head>
    <title>Papeleria Escolar</title>
</head>

<body>

    <h1>Papeleria Escolar</h1>

    <h2>Calculadora de copias</h2>

    <label>Copias a color:</label>
    <input type="number" id="color" value="0">

    <br><br>

    <label>Copias blanco y negro:</label>
    <input type="number" id="blanco" value="0">

    <br><br>

    <label>
        <input type="checkbox" id="alumno">
        ¿Presenta credencial escolar?
    </label>

    <br><br>

    <button onclick="calcular()">Calcular</button>

    <h2 id="resultado"></h2>

    <script>

    function calcular() {

        let color = Number(document.getElementById("color").value);
        let blanco = Number(document.getElementById("blanco").value);
        let alumno = document.getElementById("alumno").checked;

        let cantidad = color + blanco;

        let precioColor, precioBlanco;

        if (cantidad <= 50) {
            precioColor = 1.50;
            precioBlanco = 1.00;
        }
        else if (cantidad <= 100) {
            precioColor = 1.30;
            precioBlanco = 0.80;
        }
        else {
            precioColor = 1.00;
            precioBlanco = 0.50;
        }

        let total = (color * precioColor) + (blanco * precioBlanco);

        if (alumno) {
            total = total * 0.75;
        }

        document.getElementById("resultado").innerHTML =
        "Total de copias: " + cantidad +
        "<br> Total a pagar: $" + total.toFixed(2);

    }

    </script>

</body>
</html>
